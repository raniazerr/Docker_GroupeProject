name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Debug secrets
        run: |
          echo "user=${{ secrets.DOCKERHUB_USER }}"
          echo "token length=${#DOCKERHUB_TOKEN}"
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USER }}/todo-api:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USER }}/todo-api:latest
  deploy-k3s:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Load kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/todo-api \
            todo-api=${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/todo-api
