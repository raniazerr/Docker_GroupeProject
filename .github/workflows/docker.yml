name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Debug secrets
        run: |
          echo "user=${{ secrets.DOCKERHUB_USER }}"
          echo "token length=${#DOCKERHUB_TOKEN}"
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USER }}/todo-api:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USER }}/todo-api:latest
