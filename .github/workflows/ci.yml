name: CI
 
on:
  push:
    branches: ["**"]
  pull_request:
 
jobs:
  test-unit:
    runs-on: ubuntu-latest
    container:
      image: node:18-alpine
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run unit tests
        run: npm test
